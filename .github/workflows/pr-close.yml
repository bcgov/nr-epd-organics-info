name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: pr-${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    name: Cleanup and Image Promotion
    permissions:
      contents: read
      packages: write
    uses: bcgov/actions-openshift/.github/workflows/.pr-close.yml@47805d2fc4e919382757c1fbeb68d39313abe64f # v0.11.0
    secrets:
      oc_namespace: ${{ vars.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      oc_server: ${{ vars.oc_server }}
    with:
      cleanup: helm
      packages: |
        backend
        frontend
