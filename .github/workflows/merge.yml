name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/**"
      - ".graphics/**"
      - "!.github/workflows/.deploy.yml"
      - "!.github/workflows/merge.yml"
  workflow_dispatch:
    inputs:
      pr_no:
        description: "PR-numbered container set to deploy"
        type: number
        required: true

permissions: {}

jobs:
  vars:
    name: Resolve Images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      pull-requests: read
    strategy:
      matrix:
        package: [backend, frontend]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Resolve the image digest built for this commit (squash merges walk back to the PR build)
      - name: Resolve image
        id: tracker
        uses: bcgov/actions/image-tracker@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          package: ${{ matrix.package }}
          max_depth: 100

      # Tag that digest with the merge commit SHA; deploys and promotion use this tag
      - name: Tag image with commit SHA
        uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ steps.tracker.outputs.digest }}
          tags: ${{ github.sha }}

  deploy-test:
    name: Deploy (test)
    needs: [vars]
    uses: ./.github/workflows/.deploy.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      environment: test
      tag: ${{ github.sha }}
      release: test
      params: |
        --set backend.deploymentStrategy=RollingUpdate \
        --set frontend.deploymentStrategy=RollingUpdate \
        --set backend.pdb.enabled=false \
        --set frontend.pdb.enabled=false \
        --set-string global.amsURL="https://j200.gov.bc.ca/pub/ams/" \
        --set-string backend.env.omrrAppStatusFlag="true" \
        --set-string backend.env.omrrAuthzDocsFlag="true" \
  tests:
    name: Tests
    permissions:
      contents: read
    needs: [deploy-test]
    uses: ./.github/workflows/.tests.yml
    with:
      target: test

  deploy-prod:
    name: Deploy (prod)
    needs: [vars, tests]
    uses: ./.github/workflows/.deploy.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      environment: prod
      tag: ${{ github.sha }}
      release: prod
      params: |
        --set-string global.amsURL="https://j200.gov.bc.ca/pub/ams/" \
        --set-string backend.env.omrrAppStatusFlag="true" \
        --set-string backend.env.omrrAuthzDocsFlag="true" \
        --set-string global.nrptiAPIURL="https://nrpti-api-f00029-prod.apps.silver.devops.gov.bc.ca" \
        --set-string global.nrcedURL="https://nrced.gov.bc.ca" \

  promote:
    name: Promote Images
    needs: [deploy-prod, vars]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ github.sha }}
          tags: prod
