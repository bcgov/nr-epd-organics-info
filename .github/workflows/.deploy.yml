name: .Deploys

on:
  workflow_call:
    inputs:
      ### Required
      release:
        description: Deployment release; usually PR number, test or prod
        required: true
        type: string

      ### Typical / recommended
      autoscaling:
        description: Autoscaling enabled or not for the deployments
        required: false
        type: boolean
        default: true
      environment:
        description: Environment name; omit for PRs
        required: false
        type: string
      tag:
        description: Container tag; usually PR number
        required: false
        type: string
        default: ${{ github.event.number }}
      triggers:
        description: Paths to trigger a deploy; omit=always; one path per line (multiline string), e.g. backend/ and frontend/ on separate lines
        required: false
        type: string

      ### Usually a bad idea / not recommended
      directory:
        description: "Chart directory"
        default: "charts/${{ github.event.repository.name }}"
        required: false
        type: string
      timeout-minutes:
        description: "Timeout minutes"
        default: 10
        required: false
        type: number
      values:
        description: "Values file"
        default: "values.yaml"
        required: false
        type: string
      params:
        description: "Extra parameters to pass to helm upgrade"
        default: ""
        required: false
        type: string

permissions: {}

env:
  repo_release: ${{ github.event.repository.name }}-${{ inputs.release }}
  package_tag: ${{ inputs.tag }}

jobs:
  deploys:
    name: Helm
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        uses: bcgov/actions-openshift/oc-runner@510a8105fdffbb718094e8a093e638132e300975 # v0.10.0
        with:
          oc_namespace: ${{ vars.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.oc_server }}
          triggers: ${{ inputs.triggers }}
          # One oc-runner step: each login and each oc/helm process opens its own API connection
          commands: |
            # Interrupt any previous deployments (PR only, status = pending-*)
            if [ "${{ github.event_name }}" = pull_request ]; then
              PREVIOUS=$(helm status ${{ env.repo_release }} -o json | jq .info.status || true)
              if [[ ${PREVIOUS} =~ pending ]]; then
                echo "Rollback triggered"
                helm rollback ${{ env.repo_release }} || \
                  helm uninstall ${{ env.repo_release }}
              fi
            fi

            # If directory provided, cd to it
            [ -z "${{ inputs.directory }}" ]|| cd ${{ inputs.directory }}
            # Deploy Helm Chart
            helm dependency update
            helm package --app-version="${{ env.package_tag }}" --version=1.0.0-${{ github.run_number }} .

            if ! helm upgrade \
              --set global.autoscaling=${{ inputs.autoscaling }} \
              --set-string global.repository=${{ github.repository }} \
              --set-string global.tag="${{ env.package_tag }}" \
              ${{ inputs.params }} \
              --install --wait "${{ env.repo_release }}" \
              --timeout $(( ${{ inputs.timeout-minutes }} - 2 ))m \
              --values ${{ inputs.values }} \
              ./${{ github.event.repository.name }}-1.0.0-${{ github.run_number }}.tgz; then
              echo "::group::OpenShift diagnostics on Helm failure"
              oc get deployments,rs,pods -l "app.kubernetes.io/instance=${{ env.repo_release }}" -o wide || true
              oc describe rs,pods -l "app.kubernetes.io/instance=${{ env.repo_release }}" || true
              oc logs -l "app.kubernetes.io/instance=${{ env.repo_release }}" --all-containers --tail=50 --prefix || true
              oc logs -l "app.kubernetes.io/instance=${{ env.repo_release }}" --all-containers --previous --tail=50 --prefix || true
              oc get events --sort-by='.lastTimestamp' | tail -n 50 || true
              oc describe resourcequota || true
              echo "::endgroup::"
              helm rollback "${{ env.repo_release }}" || helm uninstall "${{ env.repo_release }}" || true
              exit 1
            fi
