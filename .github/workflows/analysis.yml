name: Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  schedule:
    - cron: "0 11 * * 0" # 3 AM PST = 12 PM UDT, runs sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend-tests:
    name: Backend Tests
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: bcgov/actions/test-and-analyse@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          commands: |
            npm ci
            npm run test:cov
          working_directory: backend
          node_version: "24"
          sonar_args: >
            -Dsonar.exclusions=**/coverage/**,**/node_modules/**,**/*spec.ts,**/*test.ts,**/*test.tsx,**/e2e/**
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.projectKey=nr-omrr-transparency-backend
            -Dsonar.sources=src
            -Dsonar.tests.inclusions=**/*spec.ts,**/*test.ts,**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info
          unused_deps: warn
          supply_scan: true
          triggers: backend/

  frontend-tests:
    name: Frontend Tests
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: bcgov/actions/test-and-analyse@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          commands: |
            npm ci
            npm run test:cov
          working_directory: frontend
          node_version: "24"
          sonar_args: >
            -Dsonar.exclusions=**/coverage/**,**/node_modules/**,**/*spec.ts,**/*test.tsx,**/routeTree.gen.ts
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.projectKey=nr-omrr-transparency-frontend
            -Dsonar.sources=src
            -Dsonar.test.inclusions=**/*spec.ts,**/*test.tsx
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info
          unused_deps: warn
          supply_scan: true
          triggers: frontend/

  # https://github.com/marketplace/actions/aqua-security-trivy
  trivy:
    name: Trivy Security Scan
    if: (! github.event.pull_request.draft)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivycache
          # Hashing the workflow file ensures the cache is automatically busted whenever
          # the aquasecurity/trivy-action version changes, preventing DB schema crashes.
          key: ${{ runner.os }}-trivy-${{ hashFiles('.github/workflows/analysis.yml') }}

      # Findings are reported to the Security tab for triage rather than failing the build.
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          trivyignores: ".github/.trivyignore"
          cache-dir: .trivycache
          skip-dirs: "**/node_modules,**/coverage,**/dist,.git"
          exit-code: "0"

      # PR uploads must target the branch head ref so retries and merge-ref recalculations do not orphan the scan.
      - name: Upload Trivy scan results to GitHub Security tab (PR)
        if: always() && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "trivy"
          sarif_file: "trivy-results.sarif"
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}

      # Push / schedule / workflow_dispatch on main use default ambient ref and sha.
      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "trivy"
          sarif_file: "trivy-results.sarif"

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: Analysis Results
    needs: [backend-tests, frontend-tests, trivy]
    if: always() && (! github.event.pull_request.draft)
    runs-on: ubuntu-slim
    permissions: {}
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          needs: ${{ toJson(needs) }}
