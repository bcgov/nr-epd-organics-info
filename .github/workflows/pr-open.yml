name: PR

on:
  pull_request:

concurrency:
  # Cancel in progress for PR open and close
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  # https://github.com/bcgov/actions/tree/main/builder
  builds:
    name: Builds
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [backend, frontend]
    timeout-minutes: 10
    steps:
      - uses: bcgov/actions/builder@122a9b1c6c082b1b1f18c300020fbdc417b6b0b2 # v0.10.0
        with:
          package: ${{ matrix.package }}
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ${{ matrix.package }}/

  # https://github.com/bcgov/action-deployer-openshift
  deploys:
    name: Deploys
    needs: [builds]
    uses: ./.github/workflows/.deploy.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      autoscaling: false
      tag: ${{ github.event.number }}
      release: ${{ github.event.number }}
      params: |
        --set backend.deploymentStrategy=Recreate \
        --set frontend.deploymentStrategy=Recreate \
        --set backend.pdb.enabled=false \
        --set frontend.pdb.enabled=false \
        --set global.amsURL=https://test.j200.gov.bc.ca/pub/ams/ \
        --set global.nrptiAPIURL=https://nrpti-api-f00029-prod.apps.silver.devops.gov.bc.ca \
        --set global.nrcedURL=https://nrced.gov.bc.ca \
        --set-string backend.env.omrrAuthzDocsFlag=true \

  tests:
    name: Tests
    needs: [deploys]
    permissions:
      contents: read
    uses: ./.github/workflows/.tests.yml
    with:
      target: ${{ github.event.number }}
  results:
    name: PR Results
    needs: [builds, deploys, tests]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@122a9b1c6c082b1b1f18c300020fbdc417b6b0b2 # v0.10.0
        with:
          needs: ${{ toJson(needs) }}
